[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rugtrip"
version = "0.1.0"
description = "Client for the RugTrip API: rug-risk verdicts for Robinhood Chain pools, a pre-trade policy gate and a live verdict/pull stream."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25",
    "websockets>=13",
]
keywords = ["rugtrip", "robinhood-chain", "rug-check", "token-risk", "trading-bot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/rugtrip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
