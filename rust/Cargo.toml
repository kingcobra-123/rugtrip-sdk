[package]
name = "rugtrip"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Client for the RugTrip API: rug-risk verdicts for Robinhood Chain pools, a pre-trade policy gate and a live verdict/pull stream."
readme = "README.md"
keywords = ["rugtrip", "robinhood-chain", "rug-check", "trading-bot", "token-risk"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "macros", "rt", "net"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
